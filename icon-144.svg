<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#130f20"/>
      <stop offset="100%" style="stop-color:#09070f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0aaff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
    <filter id="gf">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <ellipse cx="256" cy="160" rx="180" ry="120" fill="#c084fc" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="256" cy="380" rx="120" ry="80" fill="#a855f7" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g stroke="#c084fc" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#c084fc" stroke-width="3" fill="none" opacity="0.5">
    <polyline points="60,80 60,60 80,60"/>
    <polyline points="432,80 432,60 452,60"/>
    <polyline points="60,432 60,452 80,452"/>
    <polyline points="432,432 432,452 452,452"/>
  </g>

  <!-- Border -->
  <rect x="2" y="2" width="508" height="508" rx="95" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <!-- Top accent line -->
  <line x1="96" y1="2" x2="416" y2="2" stroke="#c084fc" stroke-width="2.5" opacity="0.7"/>

  <!-- RA monogram - main letters -->
  <!-- R -->
  <g filter="url(#gf)">
    <text x="128" y="330" font-family="serif" font-size="240" font-weight="900"
          fill="url(#glow)" opacity="0.95" letter-spacing="-20">RA</text>
  </g>

  <!-- Scanline overlay -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" opacity="0.15"/>

  <!-- Bottom label -->
  <text x="256" y="458" font-family="monospace" font-size="22" font-weight="700"
        fill="#7c5fa0" text-anchor="middle" letter-spacing="6">CODELENS</text>

  <!-- Top dot indicator -->
  <circle cx="256" cy="38" r="5" fill="#c084fc" opacity="0.8"/>
  <circle cx="256" cy="38" r="9" fill="#c084fc" opacity="0.2"/>
</svg>